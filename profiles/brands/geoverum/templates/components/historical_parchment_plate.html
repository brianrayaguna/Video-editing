<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent;
      font-family: '{{SERIF_FONT}}', 'Lora', 'EB Garamond', Georgia, serif;
      font-variant-numeric: tabular-nums;
      font-optical-sizing: auto;
      font-kerning: normal;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }
    #{{SCENE_ID}}-canvas-bg {
      position: absolute;
      inset: 0;
      background-color: #C2AD8D;
      background-image:
        linear-gradient(rgba(52, 38, 22, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(52, 38, 22, 0.08) 1px, transparent 1px),
        radial-gradient(circle at 50% 42%, rgba(242, 228, 200, 0.4) 0%, rgba(124, 98, 66, 0.42) 100%);
      background-size:
        calc(52px * {{SCALE_FACTOR}}) calc(52px * {{SCALE_FACTOR}}),
        calc(52px * {{SCALE_FACTOR}}) calc(52px * {{SCALE_FACTOR}}),
        100% 100%;
    }
    #{{SCENE_ID}}-wash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 42%, rgba(185, 152, 108, 0.24) 0%, rgba(16, 12, 8, 0.56) 100%);
      pointer-events: none;
    }
    #{{SCENE_ID}}-clip {
      position: absolute;
      top: {{SAFE_TOP_PCT}}%;
      bottom: {{CAPTION_BOTTOM_PCT}}%;
      left: {{SYM_X_PCT}}%;
      right: {{SYM_X_PCT}}%;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }
    /* Variant 1: era_stamp (straight 0-deg boxless directly over map) */
    #{{SCENE_ID}}-era {
      width: 100%;
      max-width: calc(660px * {{SCALE_FACTOR}});
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: calc(12px * {{SCALE_FACTOR}});
      will-change: transform, opacity;
    }
    .gv-era-year {
      font-family: '{{TITLE_FONT}}', 'Archivo Black', 'Barlow Condensed', sans-serif;
      font-size: calc(92px * {{SCALE_FACTOR}});
      font-weight: 400;
      line-height: 0.98;
      letter-spacing: -0.01em;
      color: #F4F1EA;
      text-shadow:
        0 4px 22px rgba(0, 0, 0, 0.88),
        0 2px 5px rgba(0, 0, 0, 0.96);
    }
    .gv-era-title {
      font-family: '{{SERIF_FONT}}', 'Lora', 'EB Garamond', Georgia, serif;
      font-size: calc(44px * {{SCALE_FACTOR}});
      font-weight: 700;
      line-height: 1.12;
      text-wrap: balance;
      color: #F5C542;
      text-shadow:
        0 3px 16px rgba(0, 0, 0, 0.9),
        0 1px 4px rgba(0, 0, 0, 0.98);
    }
    .gv-era-excerpt {
      font-family: '{{SERIF_FONT}}', 'Lora', 'EB Garamond', Georgia, serif;
      font-size: calc(32px * {{SCALE_FACTOR}});
      font-weight: 500;
      font-style: italic;
      line-height: 1.32;
      letter-spacing: 0.01em;
      text-wrap: balance;
      color: #F4F1EA;
      max-width: 92%;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.92);
    }
    /* Variant 2: parchment_canvas (100% full-bleed aged sepia sheet, zero floating mini box) */
    #{{SCENE_ID}}-parch {
      width: 100%;
      max-width: calc(660px * {{SCALE_FACTOR}});
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: calc(16px * {{SCALE_FACTOR}});
      will-change: transform, opacity;
    }
    .gv-parch-year {
      font-family: '{{TITLE_FONT}}', 'Archivo Black', 'Barlow Condensed', sans-serif;
      font-size: calc(86px * {{SCALE_FACTOR}});
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.01em;
      color: #24190E;
    }
    .gv-parch-title {
      font-family: '{{SERIF_FONT}}', 'Lora', 'EB Garamond', Georgia, serif;
      font-size: calc(46px * {{SCALE_FACTOR}});
      font-weight: 700;
      line-height: 1.14;
      text-wrap: balance;
      color: #1A120A;
    }
    .gv-parch-excerpt {
      font-family: '{{SERIF_FONT}}', 'Lora', 'EB Garamond', Georgia, serif;
      font-size: calc(33px * {{SCALE_FACTOR}});
      font-weight: 500;
      font-style: italic;
      line-height: 1.35;
      letter-spacing: 0.01em;
      text-wrap: balance;
      color: #382817;
      max-width: 92%;
    }
    /* Variant 3: archival_sheet (large 84%-width physical document/map scan image_src) */
    #{{SCENE_ID}}-sheet {
      width: 94%;
      max-width: calc(740px * {{SCALE_FACTOR}});
      background: #D8C7AB;
      padding: calc(18px * {{SCALE_FACTOR}});
      box-shadow: 0 calc(20px * {{SCALE_FACTOR}}) calc(44px * {{SCALE_FACTOR}}) rgba(0, 0, 0, 0.56);
      display: flex;
      flex-direction: column;
      gap: calc(10px * {{SCALE_FACTOR}});
      will-change: transform, opacity;
    }
    #{{SCENE_ID}}-sheet-img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
    }
    #{{SCENE_ID}}-sheet-cap {
      font-family: '{{SERIF_FONT}}', 'Lora', 'EB Garamond', Georgia, serif;
      font-size: calc(28px * {{SCALE_FACTOR}});
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 0.01em;
      color: #2A1E12;
      text-align: center;
    }
    /* Variant 4: timeline_bar (positioned inside #clip safe band + vintage open-water compass rose) */
    #{{SCENE_ID}}-timeline {
      position: absolute;
      top: calc(24px * {{SCALE_FACTOR}});
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(12px * {{SCALE_FACTOR}});
      pointer-events: none;
    }
    .gv-tl-years {
      font-family: '{{MONO_FONT}}', 'IBM Plex Mono', monospace;
      font-size: calc(34px * {{SCALE_FACTOR}});
      font-weight: 600;
      line-height: 1.22;
      letter-spacing: 0.06em;
      color: #F4E6C3;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
    }
    .gv-tl-track {
      position: relative;
      width: 100%;
      max-width: calc(680px * {{SCALE_FACTOR}});
      height: calc(5px * {{SCALE_FACTOR}});
      background: rgba(244, 230, 195, 0.34);
    }
    #{{SCENE_ID}}-tl-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #D9B76E 0%, #F5C542 100%);
      transform-origin: left center;
      box-shadow: 0 0 12px rgba(245, 197, 66, 0.65);
    }
    .gv-tl-title {
      font-family: '{{SERIF_FONT}}', 'Lora', 'EB Garamond', Georgia, serif;
      font-size: calc(30px * {{SCALE_FACTOR}});
      font-weight: 600;
      line-height: 1.28;
      letter-spacing: 0.01em;
      text-wrap: balance;
      color: #F4F1EA;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.88);
    }
    #{{SCENE_ID}}-compass {
      position: absolute;
      left: 0;
      bottom: calc(24px * {{SCALE_FACTOR}});
      width: calc(150px * {{SCALE_FACTOR}});
      height: calc(150px * {{SCALE_FACTOR}});
      opacity: 0.58;
      pointer-events: none;
    }
    .gv-empty {
      display: none !important;
    }
  </style>
  <div id="root" data-composition-id="{{SCENE_ID}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" {{MOTION_BLUR_ATTR}}>
    <div id="{{SCENE_ID}}-canvas-bg"></div>
    <div id="{{SCENE_ID}}-wash"></div>
    <div id="{{SCENE_ID}}-clip" class="clip" data-start="0" data-duration="{{DURATION_S}}">
      <!-- Variant 1: era_stamp -->
      <div id="{{SCENE_ID}}-era">
        <div id="{{SCENE_ID}}-e-year" class="gv-era-year" data-var-text="year">{{VAR_YEAR|1803}}</div>
        <div id="{{SCENE_ID}}-e-title" class="gv-era-title" data-var-text="title">{{VAR_TITLE|}}</div>
        <div id="{{SCENE_ID}}-e-ex" class="gv-era-excerpt" data-var-text="excerpt">{{VAR_EXCERPT|}}</div>
      </div>

      <!-- Variant 2: parchment_canvas -->
      <div id="{{SCENE_ID}}-parch">
        <div id="{{SCENE_ID}}-p-year" class="gv-parch-year" data-var-text="year">{{VAR_YEAR|1803}}</div>
        <div id="{{SCENE_ID}}-p-title" class="gv-parch-title" data-var-text="title">{{VAR_TITLE|}}</div>
        <div id="{{SCENE_ID}}-p-ex" class="gv-parch-excerpt" data-var-text="excerpt">{{VAR_EXCERPT|}}</div>
      </div>

      <!-- Variant 3: archival_sheet -->
      <div id="{{SCENE_ID}}-sheet">
        <img id="{{SCENE_ID}}-sheet-img" alt="" data-src="{{VAR_IMAGE_SRC|}}" data-var-src="image_src" />
        <div id="{{SCENE_ID}}-sheet-cap" data-var-text="title">{{VAR_YEAR|1803}} · {{VAR_TITLE|}}</div>
      </div>

      <!-- Variant 4: timeline_bar (positioned in upper safe band + vintage open-water compass rose) -->
      <div id="{{SCENE_ID}}-timeline">
        <div id="{{SCENE_ID}}-tl-years" class="gv-tl-years" data-var-text="year">{{VAR_YEAR|756 – 1870}}</div>
        <div class="gv-tl-track"><div id="{{SCENE_ID}}-tl-fill"></div></div>
        <div id="{{SCENE_ID}}-tl-title" class="gv-tl-title" data-var-text="title">{{VAR_TITLE|}}</div>
      </div>
      <svg id="{{SCENE_ID}}-compass" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="60" r="46" fill="none" stroke="#8C6239" stroke-width="2.5" />
        <circle cx="60" cy="60" r="36" fill="none" stroke="#8C6239" stroke-width="1.2" />
        <polygon points="60,12 68,52 60,60 52,52" fill="#8C6239" />
        <polygon points="60,108 68,68 60,60 52,68" fill="#C2A378" stroke="#8C6239" stroke-width="1.2" />
        <polygon points="108,60 68,68 60,60 68,52" fill="#8C6239" />
        <polygon points="12,60 52,68 60,60 52,52" fill="#C2A378" stroke="#8C6239" stroke-width="1.2" />
        <text x="60" y="9" text-anchor="middle" font-size="11" font-weight="700" fill="#6E4A27">N</text>
        <text x="60" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="#6E4A27">S</text>
        <text x="115" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#6E4A27">E</text>
        <text x="5" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#6E4A27">W</text>
      </svg>
    </div>
  </div>
  <script>
    (function () {
      const variant = ("{{VAR_VARIANT|era_stamp}}").trim().toLowerCase();
      const tiltDeg = Number({{VAR_TILT_DEG|0}});
      const imgSrc = ("{{VAR_IMAGE_SRC|}}").trim();

      const bgEl = document.getElementById("{{SCENE_ID}}-canvas-bg");
      const washEl = document.getElementById("{{SCENE_ID}}-wash");
      const eraEl = document.getElementById("{{SCENE_ID}}-era");
      const parchEl = document.getElementById("{{SCENE_ID}}-parch");
      const sheetEl = document.getElementById("{{SCENE_ID}}-sheet");
      const sheetImgEl = document.getElementById("{{SCENE_ID}}-sheet-img");
      const tlEl = document.getElementById("{{SCENE_ID}}-timeline");
      const tlTitleEl = document.getElementById("{{SCENE_ID}}-tl-title");
      const compassEl = document.getElementById("{{SCENE_ID}}-compass");
      if (sheetImgEl && imgSrc) sheetImgEl.setAttribute("src", imgSrc);

      ["{{SCENE_ID}}-e-year", "{{SCENE_ID}}-p-year", "{{SCENE_ID}}-e-title", "{{SCENE_ID}}-p-title", "{{SCENE_ID}}-e-ex", "{{SCENE_ID}}-p-ex"].forEach((id) => {
        const el = document.getElementById(id);
        if (el && !el.textContent.trim()) el.classList.add("gv-empty");
      });
      const sheetCapEl = document.getElementById("{{SCENE_ID}}-sheet-cap");
      if (sheetCapEl) {
        sheetCapEl.textContent = sheetCapEl.textContent.replace(/\s*·\s*$/, "").trim();
        if (!sheetCapEl.textContent) sheetCapEl.classList.add("gv-empty");
      }
      if (tlTitleEl && !tlTitleEl.textContent.trim()) tlTitleEl.classList.add("gv-empty");

      let activeSel = "#{{SCENE_ID}}-era";
      let bgSel = "#{{SCENE_ID}}-wash";
      const isTimeline = variant === "timeline_bar";
      const isPageUnfold = variant === "page_unfold";

      if (isTimeline) {
        if (bgEl) bgEl.classList.add("gv-empty");
        if (washEl) washEl.classList.add("gv-empty");
        if (eraEl) eraEl.classList.add("gv-empty");
        if (parchEl) parchEl.classList.add("gv-empty");
        if (sheetEl) sheetEl.classList.add("gv-empty");
        activeSel = "#{{SCENE_ID}}-timeline";
      } else if (variant === "parchment_canvas" || isPageUnfold) {
        if (washEl) washEl.classList.add("gv-empty");
        if (eraEl) eraEl.classList.add("gv-empty");
        if (sheetEl) sheetEl.classList.add("gv-empty");
        if (tlEl) tlEl.classList.add("gv-empty");
        if (compassEl) compassEl.classList.add("gv-empty");
        activeSel = "#{{SCENE_ID}}-parch";
        bgSel = "#{{SCENE_ID}}-canvas-bg";
      } else if (variant === "archival_sheet" && imgSrc) {
        if (bgEl) bgEl.classList.add("gv-empty");
        if (eraEl) eraEl.classList.add("gv-empty");
        if (parchEl) parchEl.classList.add("gv-empty");
        if (tlEl) tlEl.classList.add("gv-empty");
        if (compassEl) compassEl.classList.add("gv-empty");
        activeSel = "#{{SCENE_ID}}-sheet";
        bgSel = "#{{SCENE_ID}}-wash";
      } else {
        if (bgEl) bgEl.classList.add("gv-empty");
        if (parchEl) parchEl.classList.add("gv-empty");
        if (sheetEl) sheetEl.classList.add("gv-empty");
        if (tlEl) tlEl.classList.add("gv-empty");
        if (compassEl) compassEl.classList.add("gv-empty");
      }

      const dur = Number({{DURATION_S}});
      const enterS = Math.min(Math.max(Number({{ENTRANCE_S}}), 0.3), dur * 0.32);
      const exitS = Math.min(Math.max(enterS * 0.48, 0.16), dur * 0.2);
      const exitAt = Math.max(enterS + 0.35, dur - exitS);

      const tl = gsap.timeline({ paused: true });
      if (isTimeline) {
        tl.fromTo(activeSel, { y: -12 * Number({{SCALE_FACTOR}}), opacity: 0 }, { y: 0, opacity: 1, duration: enterS, ease: "expo.out" }, 0);
        tl.fromTo("#{{SCENE_ID}}-tl-fill", { scaleX: 0 }, { scaleX: 1, duration: Math.max(0.6, exitAt - 0.15), ease: "none" }, 0.08);
        tl.fromTo("#{{SCENE_ID}}-compass", { opacity: 0, rotation: -12 }, { opacity: 0.58, rotation: 0, duration: enterS * 1.2, ease: "expo.out" }, 0.08);
        tl.to([activeSel, "#{{SCENE_ID}}-compass"], { opacity: 0, duration: exitS, ease: "power3.in" }, exitAt);
      } else if (isPageUnfold) {
        tl.fromTo(bgSel, { opacity: 0 }, { opacity: 1, duration: enterS * 0.75, ease: "power2.out" }, 0);
        tl.fromTo(
          activeSel,
          { y: 18 * Number({{SCALE_FACTOR}}), scaleY: 0.16, rotation: tiltDeg, transformOrigin: "50% 0%", opacity: 0 },
          { y: 0, scaleY: 1, rotation: tiltDeg, opacity: 1, duration: Math.max(0.35, enterS), ease: "expo.out" },
          0.03
        );
        tl.to([activeSel, bgSel], { opacity: 0, duration: exitS, ease: "power3.in" }, exitAt);
      } else {
        tl.fromTo(bgSel, { opacity: 0 }, { opacity: 1, duration: enterS * 0.8, ease: "power2.out" }, 0);
        tl.fromTo(
          activeSel,
          { y: 26 * Number({{SCALE_FACTOR}}), rotation: tiltDeg, opacity: 0 },
          { y: 0, rotation: tiltDeg, opacity: 1, duration: enterS, ease: "expo.out" },
          0.04
        );
        tl.to([activeSel, bgSel], { opacity: 0, duration: exitS, ease: "power3.in" }, exitAt);
      }

      window.__timelines = window.__timelines || {};
      window.__timelines["{{SCENE_ID}}"] = tl;
    })();
  </script>
</template>

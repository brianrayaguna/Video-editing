<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent;
      --vedit-ink: {{FG_COLOR}};
      --vedit-accent: {{ACCENT_COLOR}};
      --vedit-crimson: #C2412D;
      font-family: '{{BODY_FONT}}', 'Inter', sans-serif;
      font-optical-sizing: auto;
      font-kerning: normal;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }
    #{{SCENE_ID}}-clip {
      position: absolute;
      top: {{SAFE_TOP_PCT}}%;
      bottom: {{CAPTION_BOTTOM_PCT}}%;
      left: {{SYM_X_PCT}}%;
      right: {{SYM_X_PCT}}%;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }
    #{{SCENE_ID}}-redx-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: calc(16px * {{SCALE_FACTOR}});
    }
    #{{SCENE_ID}}-svg {
      width: calc(240px * {{SCALE_FACTOR}});
      height: calc(240px * {{SCALE_FACTOR}});
      overflow: visible;
    }
    #{{SCENE_ID}}-claim {
      font-family: '{{DISPLAY_FONT}}', 'Archivo Black', sans-serif;
      font-size: calc(42px * {{SCALE_FACTOR}});
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: 0.01em;
      color: var(--vedit-ink);
      text-shadow: 0 3px 16px rgba(0, 0, 0, 0.94);
    }
    #{{SCENE_ID}}-correction {
      font-size: calc(28px * {{SCALE_FACTOR}});
      font-weight: 600;
      line-height: 1.32;
      letter-spacing: 0.01em;
      color: var(--vedit-accent);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.94);
    }
    #{{SCENE_ID}}-acronym-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: calc(16px * {{SCALE_FACTOR}});
    }
    #{{SCENE_ID}}-acro-short {
      font-family: '{{TITLE_FONT}}', 'Montserrat', sans-serif;
      font-size: calc(78px * {{SCALE_FACTOR}});
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.08em;
      color: var(--vedit-accent);
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.94);
    }
    #{{SCENE_ID}}-acro-exp {
      font-family: '{{DISPLAY_FONT}}', 'Archivo Black', sans-serif;
      font-size: calc(44px * {{SCALE_FACTOR}});
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: 0.01em;
      color: var(--vedit-ink);
      text-shadow: 0 3px 16px rgba(0, 0, 0, 0.94);
    }
    .gv-acro-init {
      color: var(--vedit-accent);
    }
    .gv-empty {
      display: none !important;
    }
  </style>
  <div id="root" data-composition-id="{{SCENE_ID}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" {{MOTION_BLUR_ATTR}}>
    <div id="{{SCENE_ID}}-clip" class="clip" data-start="0" data-duration="{{DURATION_S}}">
      <div id="{{SCENE_ID}}-redx-wrap">
        <svg id="{{SCENE_ID}}-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <circle
            id="{{SCENE_ID}}-ring"
            cx="100"
            cy="100"
            r="82"
            fill="rgba(194, 65, 45, 0.16)"
            stroke="#C2412D"
            stroke-width="14"
            pathLength="100"
            stroke-dasharray="100 120"
            stroke-dashoffset="110"
          />
          <line
            id="{{SCENE_ID}}-x1"
            x1="58"
            y1="58"
            x2="142"
            y2="142"
            stroke="#C2412D"
            stroke-width="16"
            stroke-linecap="round"
            pathLength="100"
            stroke-dasharray="100 120"
            stroke-dashoffset="110"
          />
          <line
            id="{{SCENE_ID}}-x2"
            x1="142"
            y1="58"
            x2="58"
            y2="142"
            stroke="#C2412D"
            stroke-width="16"
            stroke-linecap="round"
            pathLength="100"
            stroke-dasharray="100 120"
            stroke-dashoffset="110"
          />
        </svg>
        <div id="{{SCENE_ID}}-claim" data-var-text="claim_text">{{VAR_CLAIM_TEXT|}}</div>
        <div id="{{SCENE_ID}}-correction" data-var-text="correction_text">{{VAR_CORRECTION_TEXT|}}</div>
      </div>

      <div id="{{SCENE_ID}}-acronym-wrap">
        <div id="{{SCENE_ID}}-acro-short" data-var-text="acronym">{{VAR_ACRONYM|}}</div>
        <div id="{{SCENE_ID}}-acro-exp" data-var-text="expansion_text">{{VAR_EXPANSION_TEXT|}}</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const mode = ("{{VAR_MODE|red_x}}").trim().toLowerCase();
      const redxWrap = document.getElementById("{{SCENE_ID}}-redx-wrap");
      const acroWrap = document.getElementById("{{SCENE_ID}}-acronym-wrap");
      const claimEl = document.getElementById("{{SCENE_ID}}-claim");
      const corrEl = document.getElementById("{{SCENE_ID}}-correction");
      const expEl = document.getElementById("{{SCENE_ID}}-acro-exp");

      const dur = Number({{DURATION_S}});
      const enterS = Math.min(Math.max(Number({{ENTRANCE_S}}), 0.28), dur * 0.3);
      const exitS = Math.min(Math.max(enterS * 0.48, 0.14), dur * 0.18);
      const exitAt = Math.max(enterS + 0.35, dur - exitS);

      const tl = gsap.timeline({ paused: true });

      if (mode === "acronym") {
        if (redxWrap) redxWrap.classList.add("gv-empty");
        if (expEl && expEl.textContent.trim()) {
          const words = expEl.textContent.trim().split(/\s+/);
          expEl.textContent = "";
          words.forEach((w, idx) => {
            if (idx > 0) expEl.appendChild(document.createTextNode(" "));
            const lead = document.createElement("span");
            lead.className = "gv-acro-init";
            lead.textContent = w.charAt(0);
            expEl.appendChild(lead);
            expEl.appendChild(document.createTextNode(w.slice(1)));
          });
        }
        tl.fromTo(
          "#{{SCENE_ID}}-acro-short",
          { scale: 0.9, opacity: 0 },
          { scale: 1, opacity: 1, duration: enterS, ease: "expo.out" },
          0
        );
        tl.fromTo(
          "#{{SCENE_ID}}-acro-exp",
          { y: 18 * Number({{SCALE_FACTOR}}), opacity: 0 },
          { y: 0, opacity: 1, duration: enterS, ease: "expo.out" },
          enterS * 0.55
        );
      } else {
        if (acroWrap) acroWrap.classList.add("gv-empty");
        if (claimEl && !claimEl.textContent.trim()) claimEl.classList.add("gv-empty");
        if (corrEl && !corrEl.textContent.trim()) corrEl.classList.add("gv-empty");

        tl.fromTo("#{{SCENE_ID}}-ring", { strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: enterS * 0.9, ease: "expo.out" }, 0);
        tl.fromTo("#{{SCENE_ID}}-x1", { strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: enterS * 0.65, ease: "expo.out" }, enterS * 0.35);
        tl.fromTo("#{{SCENE_ID}}-x2", { strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: enterS * 0.65, ease: "expo.out" }, enterS * 0.58);

        if (claimEl && !claimEl.classList.contains("gv-empty")) {
          tl.fromTo("#{{SCENE_ID}}-claim", { y: 12 * Number({{SCALE_FACTOR}}), opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "expo.out" }, enterS * 0.45);
        }
        if (corrEl && !corrEl.classList.contains("gv-empty")) {
          tl.fromTo("#{{SCENE_ID}}-correction", { y: 12 * Number({{SCALE_FACTOR}}), opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "expo.out" }, enterS * 0.9);
        }
      }

      tl.to("#{{SCENE_ID}}-clip", { opacity: 0, duration: exitS, ease: "power3.in" }, exitAt);

      window.__timelines = window.__timelines || {};
      window.__timelines["{{SCENE_ID}}"] = tl;
    })();
  </script>
</template>

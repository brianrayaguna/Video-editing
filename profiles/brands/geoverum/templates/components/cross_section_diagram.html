<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #1B2440;
      --vedit-ink: {{FG_COLOR}};
      --vedit-accent: {{ACCENT_COLOR}};
      --vedit-hydro: #38BDF8;
      font-family: '{{BODY_FONT}}', 'Inter', sans-serif;
      font-variant-numeric: tabular-nums;
      font-optical-sizing: auto;
      font-kerning: normal;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }
    #{{SCENE_ID}}-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 24%, #2B3966 0%, #19223B 58%, #0E1526 100%);
    }
    #{{SCENE_ID}}-clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #{{SCENE_ID}}-header {
      position: absolute;
      top: calc({{SAFE_TOP_PCT}}% + calc(48px * {{SCALE_FACTOR}}));
      left: {{SYM_X_PCT}}%;
      right: {{SYM_X_PCT}}%;
      text-align: center;
    }
    .gv-xs-title {
      font-family: '{{DISPLAY_FONT}}', 'Archivo Black', sans-serif;
      font-size: calc(46px * {{SCALE_FACTOR}});
      font-weight: 800;
      line-height: 1.06;
      letter-spacing: -0.01em;
      color: var(--vedit-ink);
      text-shadow: 0 3px 16px rgba(0, 0, 0, 0.55);
    }
    #{{SCENE_ID}}-stage {
      position: absolute;
      left: 0;
      right: 0;
      top: 25%;
      height: 45%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #{{SCENE_ID}}-svg {
      width: 94%;
      height: 100%;
      max-width: calc(1020px * {{SCALE_FACTOR}});
      overflow: visible;
    }
    .gv-xs-svg-label {
      font-family: '{{BODY_FONT}}', 'Inter', sans-serif;
      font-weight: 600;
      fill: #F4F1EA;
      font-size: 29px;
      letter-spacing: 0.015em;
    }
    .gv-xs-svg-metric {
      font-family: '{{DISPLAY_FONT}}', 'Archivo Black', sans-serif;
      font-weight: 800;
      fill: #F5C542;
      font-size: 30px;
    }
    #{{SCENE_ID}}-footer {
      position: absolute;
      top: 76%;
      left: {{SYM_X_PCT}}%;
      right: {{SYM_X_PCT}}%;
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: calc(16px * {{SCALE_FACTOR}});
      text-align: center;
    }
    .gv-xs-foot-label {
      font-size: calc(28px * {{SCALE_FACTOR}});
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: 0.01em;
      color: #CBD5E1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }
    .gv-xs-foot-metric {
      font-family: '{{DISPLAY_FONT}}', 'Archivo Black', sans-serif;
      font-size: calc(32px * {{SCALE_FACTOR}});
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 0.01em;
      color: var(--vedit-accent);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
    }
    .gv-empty {
      display: none;
    }
  </style>
  <div id="root" data-composition-id="{{SCENE_ID}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" {{MOTION_BLUR_ATTR}}>
    <div id="{{SCENE_ID}}-bg"></div>
    <div id="{{SCENE_ID}}-clip" class="clip" data-start="0" data-duration="{{DURATION_S}}">
      <div id="{{SCENE_ID}}-header">
        <div id="{{SCENE_ID}}-title" class="gv-xs-title" data-var-text="title">{{VAR_TITLE|GEOLOGICAL CROSS-SECTION}}</div>
      </div>

      <div id="{{SCENE_ID}}-stage">
        <svg id="{{SCENE_ID}}-svg" viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg">
          <!-- Layer 3: Deep Bedrock / Aquifer Stratum (lowest exploded slab) -->
          <g id="{{SCENE_ID}}-slab-3">
            <polygon points="100,455 770,492 860,442 190,405" fill="#1E5F9E" />
            <polygon points="100,455 770,492 770,564 100,527" fill="#6F3626" />
            <polygon points="770,492 860,442 860,514 770,564" fill="#2A75B8" />
            <!-- Subsurface channel cut -->
            <path d="M140,468 Q340,452 510,484 T770,498 L770,524 Q520,510 340,484 T140,494 Z" fill="#38BDF8" opacity="0.88" />
          </g>

          <!-- Layer 2: Unstable Clay / Peat Overburden (middle exploded slab) -->
          <g id="{{SCENE_ID}}-slab-2">
            <polygon points="100,322 770,359 860,309 190,272" fill="#D4B895" />
            <polygon points="100,322 770,359 770,406 100,369" fill="#B89B76" />
            <polygon points="770,359 860,309 860,356 770,406" fill="#9E825E" />
            <!-- Subtle mineral speckles -->
            <circle cx="220" cy="348" r="3" fill="#6B5338" opacity="0.55" />
            <circle cx="385" cy="364" r="2.5" fill="#6B5338" opacity="0.55" />
            <circle cx="560" cy="370" r="3" fill="#6B5338" opacity="0.55" />
            <circle cx="690" cy="378" r="2.5" fill="#6B5338" opacity="0.55" />
          </g>

          <!-- Layer 1: Surface Terrain + River Channel (top slab) -->
          <g id="{{SCENE_ID}}-slab-1">
            <polygon points="100,192 770,229 860,179 190,142" fill="#77B13E" />
            <polygon points="100,192 770,229 770,268 100,231" fill="#D97828" />
            <polygon points="770,229 860,179 860,218 770,268" fill="#B55E19" />
            <!-- River ribbon across top terrain -->
            <path d="M135,173 Q310,164 475,193 T822,197 L800,212 Q475,209 305,181 T115,189 Z" fill="#22C8E8" />
            <path d="M135,173 Q310,164 475,193 T822,197" fill="none" stroke="#99F6FF" stroke-width="3" opacity="0.7" />
          </g>

          <!-- Vertical amber depth comparator / structural reference axis -->
          <g id="{{SCENE_ID}}-axis">
            <line id="{{SCENE_ID}}-axis-line" x1="892" y1="184" x2="892" y2="520" stroke="#F5C542" stroke-width="3" stroke-dasharray="8 8" pathLength="100" />
            <line x1="880" y1="184" x2="904" y2="184" stroke="#F5C542" stroke-width="3" />
            <line x1="880" y1="520" x2="904" y2="520" stroke="#F5C542" stroke-width="3" />
          </g>

          <!-- Curved white editorial leader arrows (no HUD boxes!) -->
          <g id="{{SCENE_ID}}-callouts">
            <!-- Top Layer Callout -->
            <path id="{{SCENE_ID}}-arr-1" d="M292,98 Q265,126 276,166" fill="none" stroke="#F4F1EA" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" />
            <polygon id="{{SCENE_ID}}-tip-1" points="276,170 267,156 284,158" fill="#F4F1EA" />
            <text id="{{SCENE_ID}}-lbl-1" x="292" y="84" text-anchor="middle" class="gv-xs-svg-label" data-var-text="layer1">{{VAR_LAYER1|SURFACE LAYER}}</text>

            <!-- Middle Layer Callout (kept cleanly inside right safe margin) -->
            <path id="{{SCENE_ID}}-arr-2" d="M640,282 Q608,290 582,318" fill="none" stroke="#F4F1EA" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" />
            <polygon id="{{SCENE_ID}}-tip-2" points="578,322 593,318 583,306" fill="#F4F1EA" />
            <text id="{{SCENE_ID}}-lbl-2" x="820" y="286" text-anchor="end" class="gv-xs-svg-label" data-var-text="layer2">{{VAR_LAYER2|SUBSURFACE STRATA}}</text>

            <!-- Deep Layer Callout -->
            <path id="{{SCENE_ID}}-arr-3" d="M510,598 Q565,588 592,526" fill="none" stroke="#F4F1EA" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110" />
            <polygon id="{{SCENE_ID}}-tip-3" points="594,520 582,532 598,536" fill="#F4F1EA" />
            <text id="{{SCENE_ID}}-lbl-3" x="495" y="614" text-anchor="end" class="gv-xs-svg-label" data-var-text="layer3">{{VAR_LAYER3|DEEP BEDROCK}}</text>
          </g>
        </svg>
      </div>

      <div id="{{SCENE_ID}}-footer">
        <span id="{{SCENE_ID}}-fl" class="gv-xs-foot-label" data-var-text="foot_label">{{VAR_FOOT_LABEL|}}</span>
        <span id="{{SCENE_ID}}-fm" class="gv-xs-foot-metric" data-var-text="foot_metric">{{VAR_FOOT_METRIC|}}</span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const flEl = document.getElementById("{{SCENE_ID}}-fl");
      const fmEl = document.getElementById("{{SCENE_ID}}-fm");
      if (flEl && !flEl.textContent.trim()) flEl.classList.add("gv-empty");
      if (fmEl && !fmEl.textContent.trim()) fmEl.classList.add("gv-empty");

      const dur = Number({{DURATION_S}});
      const exitS = Math.min(0.24, dur * 0.14);
      const exitAt = Math.max(0.8, dur - exitS);

      const tl = gsap.timeline({ paused: true });

      // Header mask reveal
      tl.fromTo(
        "#{{SCENE_ID}}-header",
        { clipPath: "inset(0 0 100% 0)", y: 16, opacity: 0 },
        { clipPath: "inset(0 0 0% 0)", y: 0, opacity: 1, duration: 0.36, ease: "expo.out" },
        0.04
      );

      // Slabs start stacked compactly, then separate vertically per beat
      tl.fromTo("#{{SCENE_ID}}-slab-1", { y: 80, opacity: 0 }, { y: -22, opacity: 1, duration: 0.55, ease: "expo.out" }, 0.08);
      tl.fromTo("#{{SCENE_ID}}-slab-2", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 0.32);
      tl.fromTo("#{{SCENE_ID}}-slab-3", { y: -45, opacity: 0 }, { y: 24, opacity: 1, duration: 0.65, ease: "expo.out" }, 0.58);

      // Vertical depth comparator
      tl.fromTo("#{{SCENE_ID}}-axis", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, transformOrigin: "center top", duration: 0.45, ease: "expo.out" }, 0.72);

      // Curved arrows draw on sequentially using stroke-dashoffset without leading dots
      const beats = [
        { arr: "#{{SCENE_ID}}-arr-1", tip: "#{{SCENE_ID}}-tip-1", lbl: "#{{SCENE_ID}}-lbl-1", t: 0.45 },
        { arr: "#{{SCENE_ID}}-arr-2", tip: "#{{SCENE_ID}}-tip-2", lbl: "#{{SCENE_ID}}-lbl-2", t: 0.85 },
        { arr: "#{{SCENE_ID}}-arr-3", tip: "#{{SCENE_ID}}-tip-3", lbl: "#{{SCENE_ID}}-lbl-3", t: 1.25 },
      ];
      beats.forEach((b) => {
        tl.fromTo(b.lbl, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.28, ease: "expo.out" }, b.t);
        tl.fromTo(b.arr, { strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: 0.42, ease: "expo.out" }, b.t + 0.06);
        tl.fromTo(b.tip, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, b.t + 0.42);
      });

      if ((flEl && !flEl.classList.contains("gv-empty")) || (fmEl && !fmEl.classList.contains("gv-empty"))) {
        tl.fromTo("#{{SCENE_ID}}-footer", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 1.5);
      }

      tl.to("#{{SCENE_ID}}-clip", { opacity: 0, duration: exitS, ease: "power3.in" }, exitAt);

      window.__timelines = window.__timelines || {};
      window.__timelines["{{SCENE_ID}}"] = tl;
    })();
  </script>
</template>

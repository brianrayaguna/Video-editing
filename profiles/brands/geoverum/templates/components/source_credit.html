<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent;
      --vedit-ink: {{FG_COLOR}};
      font-family: '{{BODY_FONT}}', 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #{{SCENE_ID}}-clip {
      position: absolute;
      top: {{SAFE_TOP_PCT}}%;
      left: {{SAFE_LEFT_PCT}}%;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      pointer-events: none;
    }
    #{{SCENE_ID}}-inner {
      font-size: calc(15px * {{SCALE_FACTOR}});
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--vedit-ink);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85);
      opacity: 0;
    }
  </style>
  <div id="root" data-composition-id="{{SCENE_ID}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}">
    <div id="{{SCENE_ID}}-clip" class="clip" data-start="0" data-duration="{{DURATION_S}}" data-layout-ignore="true">
      <span id="{{SCENE_ID}}-inner" data-var-text="text">{{VAR_TEXT|}}</span>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const targetOpacity = Number({{VAR_OPACITY|0.62}});
      tl.fromTo(
        "#{{SCENE_ID}}-inner",
        { opacity: 0 },
        { opacity: targetOpacity, duration: {{ENTRANCE_S}}, ease: "power2.out" },
        0
      );
      tl.to("#{{SCENE_ID}}-inner", { opacity: 0, duration: {{EXIT_S}}, ease: "power3.in" }, {{EXIT_AT_S}});
      window.__timelines = window.__timelines || {};
      window.__timelines["{{SCENE_ID}}"] = tl;
    })();
  </script>
</template>

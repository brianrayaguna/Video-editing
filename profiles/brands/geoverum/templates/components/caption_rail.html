<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent;
      --vedit-ink: {{FG_COLOR}};
      --vedit-ground: {{BG_COLOR}};
      --vedit-accent: {{ACCENT_COLOR}};
      --vedit-text-glow: {{TEXT_GLOW_CSS}};
      font-family: '{{BODY_FONT}}', 'Inter', sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    #{{SCENE_ID}}-clip {
      position: absolute;
      {{BAND_POSITION_CSS}}
      pointer-events: none;
    }
    #{{SCENE_ID}}-inner {
      max-width: 100%;
      text-align: center;
      color: var(--vedit-ink);
      font-size: {{CAPTION_FONT_PX}}px;
      font-weight: 600;
      line-height: 1.24;
      letter-spacing: -0.01em;
      background: transparent;
      padding: 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.88), 0 0 4px rgba(0, 0, 0, 0.92);
    }
    #{{SCENE_ID}}-inner.style-chip {
      background: {{BG_RGBA_78}};
      border-radius: 4px;
      padding: 8px 20px;
      text-shadow: none;
    }
    #{{SCENE_ID}}-inner.style-bar {
      width: 100%;
      background: {{BG_RGBA_78}};
      padding: 10px 24px;
      text-shadow: none;
    }
  </style>
  <div id="root" data-composition-id="{{SCENE_ID}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}">
    <div id="{{SCENE_ID}}-clip" class="clip" data-start="0" data-duration="{{DURATION_S}}" data-layout-allow-caption-zone="true">
      <div id="{{SCENE_ID}}-inner" class="style-{{VAR_CAPTION_STYLE|plain}}">
        <span class="vedit-caption-text" data-var-text="text">{{CAPTION_HTML}}</span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const rawGlow = ("{{TEXT_GLOW_CSS}}").trim();
      const innerEl = document.getElementById("{{SCENE_ID}}-inner");
      if (innerEl && innerEl.classList.contains("style-plain") && rawGlow && rawGlow !== "none") {
        innerEl.style.textShadow = rawGlow + ", 0 2px 10px rgba(0, 0, 0, 0.85)";
      }
      const tl = gsap.timeline({ paused: true });
      const fadeInS = Number({{CAPTION_TRANSITION_S}});
      const fadeOutS = Number({{CAPTION_FADE_OUT_S}});
      if (fadeInS > 0) {
        tl.fromTo("#{{SCENE_ID}}-inner", { opacity: 0 }, { opacity: 1, duration: fadeInS, ease: "none" }, 0);
      } else {
        tl.set("#{{SCENE_ID}}-inner", { opacity: 1 }, 0);
      }
      if (fadeOutS > 0) {
        tl.to("#{{SCENE_ID}}-inner", { opacity: 0, duration: fadeOutS, ease: "none" }, {{CAPTION_EXIT_AT_S}});
      } else {
        tl.set("#{{SCENE_ID}}-inner", { opacity: 0 }, {{DURATION_S}});
      }
      window.__timelines = window.__timelines || {};
      window.__timelines["{{SCENE_ID}}"] = tl;
    })();
  </script>
</template>

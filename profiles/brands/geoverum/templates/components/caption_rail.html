<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      width: {{WIDTH}}px;
      height: {{HEIGHT}}px;
      overflow: hidden;
      background: transparent;
      --vedit-ink: {{FG_COLOR}};
      --vedit-ground: {{BG_COLOR}};
      --vedit-accent: {{ACCENT_COLOR}};
      font-family: '{{BODY_FONT}}', 'Space Grotesk', sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    #{{SCENE_ID}}-clip {
      position: absolute;
      bottom: {{CAPTION_BOTTOM_PCT}}%;
      left: {{SYM_X_PCT}}%;
      right: {{SYM_X_PCT}}%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      pointer-events: none;
    }
    #{{SCENE_ID}}-inner {
      max-width: 100%;
      text-align: center;
      color: var(--vedit-ink);
      font-size: {{CAPTION_FONT_PX}}px;
      font-weight: 600;
      line-height: 1.24;
      letter-spacing: -0.01em;
      background: transparent;
      padding: 0;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.88), 0 0 2px rgba(0, 0, 0, 0.96);
    }
    #{{SCENE_ID}}-inner.style-chip {
      background: {{BG_RGBA_78}};
      border-radius: 6px;
      padding: 8px 20px;
      text-shadow: none;
    }
  </style>
  <div id="root" data-composition-id="{{SCENE_ID}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}">
    <div id="{{SCENE_ID}}-clip" class="clip" data-start="0" data-duration="{{DURATION_S}}">
      <div id="{{SCENE_ID}}-inner" class="style-{{VAR_CAPTION_STYLE|plain}}">
        <span class="vedit-caption-text">{{CAPTION_HTML}}</span>
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const fadeS = Number({{CAPTION_TRANSITION_S}});
    if (fadeS > 0) {
      tl.fromTo("#{{SCENE_ID}}-inner", { opacity: 0 }, { opacity: 1, duration: fadeS, ease: "none" }, 0);
      tl.to("#{{SCENE_ID}}-inner", { opacity: 0, duration: fadeS, ease: "none" }, {{CAPTION_EXIT_AT_S}});
    } else {
      tl.set("#{{SCENE_ID}}-inner", { opacity: 1 }, 0);
      tl.set("#{{SCENE_ID}}-inner", { opacity: 0 }, {{DURATION_S}});
    }
    window.__timelines = window.__timelines || {};
    window.__timelines["{{SCENE_ID}}"] = tl;
  </script>
</template>

<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent;
      --vedit-ink: {{FG_COLOR}};
      --vedit-accent: {{ACCENT_COLOR}};
      --vedit-muted: #C2D0D8;
      font-family: '{{BODY_FONT}}', 'Inter', sans-serif;
      font-variant-numeric: tabular-nums;
      font-optical-sizing: auto;
      font-kerning: normal;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }
    #{{SCENE_ID}}-scrim {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 66%;
      background: linear-gradient(
        180deg,
        rgba(3, 18, 26, 0.72) 0%,
        rgba(3, 18, 26, 0.52) 66%,
        rgba(3, 18, 26, 0) 100%
      );
      pointer-events: none;
    }
    #{{SCENE_ID}}-clip {
      position: absolute;
      top: calc({{SAFE_TOP_PCT}}% + calc(48px * {{SCALE_FACTOR}}));
      left: {{SYM_X_PCT}}%;
      right: {{SYM_X_PCT}}%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      pointer-events: none;
    }
    #{{SCENE_ID}}-board {
      width: 100%;
      max-width: calc(740px * {{SCALE_FACTOR}});
      display: flex;
      flex-direction: column;
      gap: calc(20px * {{SCALE_FACTOR}});
    }
    .gv-head-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: calc(16px * {{SCALE_FACTOR}});
    }
    .gv-title {
      font-family: '{{DISPLAY_FONT}}', 'Archivo Black', sans-serif;
      font-size: calc(40px * {{SCALE_FACTOR}});
      font-weight: 800;
      line-height: 1.06;
      letter-spacing: -0.01em;
      color: var(--vedit-ink);
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.94);
    }
    .gv-unit {
      font-size: calc(28px * {{SCALE_FACTOR}});
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--vedit-muted);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
    }
    #{{SCENE_ID}}-hairline {
      width: 100%;
      height: 1.5px;
      background: rgba(244, 241, 234, 0.34);
      transform-origin: left center;
    }
    .gv-bars {
      display: flex;
      flex-direction: column;
      gap: calc(16px * {{SCALE_FACTOR}});
    }
    .gv-row {
      display: flex;
      flex-direction: column;
      gap: calc(8px * {{SCALE_FACTOR}});
    }
    .gv-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: calc(12px * {{SCALE_FACTOR}});
    }
    .gv-name {
      font-size: calc(29px * {{SCALE_FACTOR}});
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 0.01em;
      color: var(--vedit-ink);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
    }
    .gv-val {
      font-family: '{{MONO_FONT}}', 'IBM Plex Mono', monospace;
      font-size: calc(30px * {{SCALE_FACTOR}});
      font-weight: 600;
      line-height: 1.22;
      letter-spacing: 0.01em;
      color: var(--vedit-ink);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
      white-space: nowrap;
    }
    .gv-val.lead {
      color: var(--vedit-accent);
    }
    .gv-track {
      width: 100%;
      height: calc(18px * {{SCALE_FACTOR}});
      background: rgba(244, 241, 234, 0.12);
      overflow: hidden;
    }
    .gv-fill {
      height: 100%;
      transform-origin: left center;
    }
    .gv-fill.lead {
      background: var(--vedit-accent);
    }
    .gv-fill.secondary {
      background: rgba(244, 241, 234, 0.88);
    }
    .gv-fill.tertiary {
      background: rgba(194, 208, 216, 0.62);
    }
    .gv-foot {
      font-size: calc(24px * {{SCALE_FACTOR}});
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: 0.02em;
      color: var(--vedit-muted);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.92);
    }
    .gv-empty {
      display: none;
    }
  </style>
  <div id="root" data-composition-id="{{SCENE_ID}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" {{MOTION_BLUR_ATTR}}>
    <div id="{{SCENE_ID}}-scrim"></div>
    <div id="{{SCENE_ID}}-clip" class="clip" data-start="0" data-duration="{{DURATION_S}}">
      <div id="{{SCENE_ID}}-board">
        <div id="{{SCENE_ID}}-head" class="gv-head-row">
          <div id="{{SCENE_ID}}-title" class="gv-title" data-var-text="title">{{VAR_TITLE|DATA COMPARISON}}</div>
          <div id="{{SCENE_ID}}-unit" class="gv-unit" data-var-text="unit">{{VAR_UNIT|KM}}</div>
        </div>
        <div id="{{SCENE_ID}}-hairline"></div>
        <div class="gv-bars">
          <div class="gv-row" id="{{SCENE_ID}}-r1">
            <div class="gv-meta">
              <span class="gv-name" data-var-text="bar1_label">{{VAR_BAR1_LABEL|Item 1}}</span>
              <span class="gv-val lead" id="{{SCENE_ID}}-v1" data-var-text="bar1_text">{{VAR_BAR1_TEXT|}}</span>
            </div>
            <div class="gv-track"><div class="gv-fill lead" id="{{SCENE_ID}}-f1"></div></div>
          </div>
          <div class="gv-row" id="{{SCENE_ID}}-r2">
            <div class="gv-meta">
              <span class="gv-name" data-var-text="bar2_label">{{VAR_BAR2_LABEL|Item 2}}</span>
              <span class="gv-val" id="{{SCENE_ID}}-v2" data-var-text="bar2_text">{{VAR_BAR2_TEXT|}}</span>
            </div>
            <div class="gv-track"><div class="gv-fill secondary" id="{{SCENE_ID}}-f2"></div></div>
          </div>
          <div class="gv-row" id="{{SCENE_ID}}-r3">
            <div class="gv-meta">
              <span class="gv-name" data-var-text="bar3_label">{{VAR_BAR3_LABEL|Item 3}}</span>
              <span class="gv-val" id="{{SCENE_ID}}-v3" data-var-text="bar3_text">{{VAR_BAR3_TEXT|}}</span>
            </div>
            <div class="gv-track"><div class="gv-fill tertiary" id="{{SCENE_ID}}-f3"></div></div>
          </div>
        </div>
        <div id="{{SCENE_ID}}-foot" class="gv-foot" data-layout-ignore="true" data-var-text="source">{{VAR_SOURCE|}}</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const footEl = document.getElementById("{{SCENE_ID}}-foot");
      if (footEl && !footEl.textContent.trim()) footEl.classList.add("gv-empty");

      const vals = [
        Number({{VAR_BAR1_VALUE|100}}),
        Number({{VAR_BAR2_VALUE|85}}),
        Number({{VAR_BAR3_VALUE|70}}),
      ];
      const maxVal = Math.max(1, vals[0], vals[1], vals[2]);
      const unitSuffix = "{{VAR_UNIT_LOWER|km}}";
      const fmtInt = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");

      const dur = Number({{DURATION_S}});
      const enterS = Math.min(Math.max(Number({{ENTRANCE_S}}), 0.24), dur * 0.25);
      const exitS = Math.min(Math.max(enterS * 0.5, 0.14), dur * 0.18);
      const exitAt = Math.max(enterS + 0.4, dur - exitS);

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#{{SCENE_ID}}-scrim", { opacity: 0 }, { opacity: 1, duration: enterS, ease: "power2.out" }, 0);
      tl.fromTo(
        "#{{SCENE_ID}}-head",
        { clipPath: "inset(0 0 100% 0)", y: 14, opacity: 0 },
        { clipPath: "inset(0 0 0% 0)", y: 0, opacity: 1, duration: enterS, ease: "expo.out" },
        0.02
      );
      tl.fromTo(
        "#{{SCENE_ID}}-hairline",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: enterS * 1.15, ease: "expo.out" },
        enterS * 0.35
      );

      [1, 2, 3].forEach((idx, i) => {
        const pct = Math.max(0.06, Math.min(1, vals[i] / maxVal));
        const fillEl = document.getElementById("{{SCENE_ID}}-f" + idx);
        const valEl = document.getElementById("{{SCENE_ID}}-v" + idx);
        if (fillEl) fillEl.style.width = (pct * 100).toFixed(2) + "%";

        const rowStart = enterS * 0.45 + i * 0.14;
        tl.fromTo(
          "#{{SCENE_ID}}-r" + idx,
          { opacity: 0, x: -16 * Number({{SCALE_FACTOR}}) },
          { opacity: 1, x: 0, duration: 0.28, ease: "expo.out" },
          rowStart
        );
        tl.fromTo(
          "#{{SCENE_ID}}-f" + idx,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.72, ease: "expo.out" },
          rowStart + 0.06
        );

        const counter = { v: 0 };
        const target = vals[i];
        const declaredText = valEl ? valEl.textContent.trim() : "";
        const defaultFormatted = fmtInt(target) + (unitSuffix ? " " + unitSuffix : "");
        const finalText = declaredText && declaredText !== String(target) ? declaredText : defaultFormatted;
        tl.fromTo(
          counter,
          { v: 0 },
          {
            v: target,
            duration: 0.72,
            ease: "expo.out",
            onUpdate: () => {
              if (!valEl) return;
              valEl.textContent =
                Math.abs(counter.v - target) < 0.5
                  ? finalText
                  : fmtInt(counter.v) + (unitSuffix ? " " + unitSuffix : "");
            },
          },
          rowStart + 0.06
        );
      });

      if (footEl && !footEl.classList.contains("gv-empty")) {
        tl.fromTo(
          "#{{SCENE_ID}}-foot",
          { opacity: 0 },
          { opacity: 0.85, duration: 0.24, ease: "power2.out" },
          enterS + 0.45
        );
      }

      tl.to(
        ["#{{SCENE_ID}}-board", "#{{SCENE_ID}}-scrim"],
        { opacity: 0, y: -12 * Number({{SCALE_FACTOR}}), duration: exitS, ease: "power3.in" },
        exitAt
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["{{SCENE_ID}}"] = tl;
    })();
  </script>
</template>

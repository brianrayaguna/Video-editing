<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent;
      --vedit-ink: {{FG_COLOR}};
      --vedit-accent: {{ACCENT_COLOR}};
      font-family: '{{BODY_FONT}}', 'Inter', sans-serif;
      font-optical-sizing: auto;
      font-kerning: normal;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }
    #{{SCENE_ID}}-clip {
      position: absolute;
      top: calc({{SAFE_TOP_PCT}}% + calc(48px * {{SCALE_FACTOR}}));
      left: {{SYM_X_PCT}}%;
      right: {{SYM_X_PCT}}%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      pointer-events: none;
    }
    #{{SCENE_ID}}-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: calc(660px * {{SCALE_FACTOR}});
    }
    #{{SCENE_ID}}-title {
      font-family: '{{DISPLAY_FONT}}', 'Barlow Condensed', 'Archivo Black', sans-serif;
      font-size: calc(68px * {{SCALE_FACTOR}});
      font-weight: 800;
      line-height: 1.04;
      letter-spacing: -0.02em;
      text-wrap: balance;
      color: var(--vedit-ink);
      text-shadow:
        0 6px 26px rgba(3, 22, 31, 0.88),
        0 2px 6px rgba(0, 0, 0, 0.98);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      column-gap: calc(16px * {{SCALE_FACTOR}});
      row-gap: calc(8px * {{SCALE_FACTOR}});
    }
    .gv-word-mask {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
      padding-bottom: 0.16em;
      margin-bottom: -0.12em;
    }
    .gv-word-inner {
      display: inline-block;
      will-change: transform, opacity;
    }
    .gv-word-accent {
      color: var(--vedit-accent);
    }
    .gv-empty {
      display: none;
    }
  </style>
  <div id="root" data-composition-id="{{SCENE_ID}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" {{MOTION_BLUR_ATTR}}>
    <div id="{{SCENE_ID}}-clip" class="clip" data-start="0" data-duration="{{DURATION_S}}">
      <div id="{{SCENE_ID}}-wrap">
        <div id="{{SCENE_ID}}-title" data-var-text="title">{{VAR_TITLE|MAIN CHAPTER}}</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const titleEl = document.getElementById("{{SCENE_ID}}-title");
      const accentWord = ("{{VAR_ACCENT_WORD|}}").trim().toLowerCase();

      const rawTitle = titleEl ? titleEl.textContent.trim() : "";
      const words = rawTitle ? rawTitle.split(/\s+/) : [];
      const wordInners = [];
      if (titleEl && words.length > 0) {
        titleEl.textContent = "";
        words.forEach((word) => {
          const mask = document.createElement("span");
          mask.className = "gv-word-mask";
          const inner = document.createElement("span");
          inner.className = "gv-word-inner";
          if (accentWord && word.toLowerCase().replace(/[^a-z0-9]/g, "") === accentWord.replace(/[^a-z0-9]/g, "")) {
            inner.classList.add("gv-word-accent");
          }
          inner.textContent = word;
          mask.appendChild(inner);
          titleEl.appendChild(mask);
          wordInners.push(inner);
        });
      }

      const dur = Number({{DURATION_S}});
      const enterS = Math.min(Math.max(Number({{ENTRANCE_S}}), 0.28), dur * 0.34);
      const exitS = Math.min(Math.max(enterS * 0.45, 0.14), dur * 0.2);
      const exitAt = Math.max(enterS + 0.3, dur - exitS);

      const tl = gsap.timeline({ paused: true });
      wordInners.forEach((el, idx) => {
        tl.fromTo(
          el,
          { yPercent: 112 },
          { yPercent: 0, duration: enterS, ease: "expo.out" },
          0.02 + idx * 0.068
        );
      });
      // Landed title holds dead still, then wipes cleanly upward on exit.
      tl.to(
        "#{{SCENE_ID}}-wrap",
        { y: -22 * Number({{SCALE_FACTOR}}), opacity: 0, duration: exitS, ease: "power3.in" },
        exitAt
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["{{SCENE_ID}}"] = tl;
    })();
  </script>
</template>

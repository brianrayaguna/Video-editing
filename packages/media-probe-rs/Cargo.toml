[package]
name = "vedit-probe"
version = "0.1.0"
edition = "2024"
description = "Fast deterministic media probe, SHA-256 CAS hasher, shot & CIELAB visual analyzer."

[[bin]]
name = "vedit-probe"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

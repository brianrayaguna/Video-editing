[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "vedit-director"
version = "0.1.0"
description = "Provider-agnostic directing, brand policy, and cloud-render orchestration engine."
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.9.0",
  "jsonschema>=4.23.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.2",
  "typer>=0.12.5",
  "modal>=1.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[project.scripts]
vedit = "vedit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vedit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

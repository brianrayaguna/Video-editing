# Capability-to-Provider Configuration (copy to config/providers.yaml)
# Never put raw API keys in this file; reference environment variable names only.

defaults:
  decision:
    primary: liquid_d1
    fallback: []
    options:
      auth_type: api_key
      model: d1.2-ultra
      endpoint: https://api.liquid.ai/decisions/v1/systemone
      max_images_per_batch: 8
      max_body_mb: 4.5
      auto_enable: true
      confidence_threshold: 0.75
      api_key_env: LIQUID_API_KEY

  media_ops:
    primary: ffmpeg
    fallback:
      - modal_cloud
    options:
      auth_type: local
      allow_generative_video: false
      fallback_options:
        modal_cloud:
          app_name: vedit-distributed-renderer
          volume_name: vedit-cas-cache-v2
          allow_generative_video: false

  audio_catalog:
    primary: epidemic
    fallback: []
    options:
      auth_type: api_key
      transport: auto
      base_url: https://api.epidemicsound.com/v0
      mcp_url: https://www.epidemicsound.com/a/mcp-service/mcp
      default_quality: high
      instrumental_only_under_speech: true
      api_key_env: EPIDEMIC_API_KEY

  geo_imagery:
    primary: google_tiles
    fallback:
      - open_imagery
    options:
      auth_type: api_key
      api_key_env: GOOGLE_MAPS_API_KEY
      map_type: satellite
      scale: scaleFactor2x
      high_dpi: true
      image_format: jpeg
      google_min_zoom: 0
      max_tiles_per_run: 500

  video_breakdown:
    primary: rea_video
    fallback: []
    options:
      auth_type: local
      use_vlm: false
      prepare_review: true
      ocr: true
      # Enable stems=true or raise workers on high-memory workstations when full stem forensics are needed.
      stems: false
      packaging: true
      asr: false
      lang: en
      workers: 1

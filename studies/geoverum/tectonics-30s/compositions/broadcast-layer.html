<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Geoverum Tectonics 30s — Broadcast Layer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
    #bug-hdr {
      position: absolute;
      top: 72px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      opacity: 0.86;
    }
    .geo-wordmark {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 32px;
      letter-spacing: 0.12em;
      color: #F4F1EA;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.68);
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="broadcast-layer" data-start="0" data-duration="30" data-width="1080" data-height="1920" data-fps="30">
    <div id="bug-hdr" class="clip" data-start="0" data-duration="30" data-track-index="1">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <circle cx="17" cy="17" r="13" stroke="#F4F1EA" stroke-width="2.2"/>
        <ellipse cx="17" cy="17" rx="6.2" ry="13" stroke="rgba(244,241,234,0.68)" stroke-width="1.3"/>
        <line x1="4" y1="17" x2="30" y2="17" stroke="rgba(244,241,234,0.68)" stroke-width="1.3"/>
        <circle cx="22.4" cy="12.2" r="2.6" fill="#C2412D"/>
      </svg>
      <span class="geo-wordmark">GEOVERUM</span>
    </div>
  </div>
</body>
</html>

<template>
  <style>
    @font-face {
      font-family: 'Space Grotesk';
      src: url('assets/fonts/SpaceGrotesk-Variable.ttf') format('truetype');
      font-weight: 300 700;
      font-style: normal;
    }
    #root {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: visible;
      background: transparent;
      font-family: 'Space Grotesk', sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    #caption-rail-clip {
      position: absolute;
      top: 1432px;
      left: 84px;
      right: 84px;
      height: 64px;
      overflow: visible;
      pointer-events: none;
    }
    /* Each caption group is positioned absolutely across the full safe width and centered via flex,
       avoiding left:50%/translateX(-50%) edge clipping per hyperframes/references/captions.md */
    .cap-slot {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
    }
    .cap-chip {
      background: rgba(6, 16, 22, 0.78);
      color: #F4F1EA;
      padding: 10px 22px 11px 22px;
      border-radius: 6px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      font-size: 32px;
      line-height: 1.25;
      letter-spacing: -0.01em;
      white-space: nowrap;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.36);
    }
  </style>
  <div id="root" data-composition-id="caption-rail" data-width="1080" data-height="1920">
    <div id="caption-rail-clip" class="clip" data-start="0" data-duration="12" data-track-index="1" data-layout-allow-overlap="true">
      <div id="cap-01" class="cap-slot"><span class="cap-chip">Kalau lihat peta, Sulawesi</span></div>
      <div id="cap-02" class="cap-slot"><span class="cap-chip">tampak seperti huruf K</span></div>
      <div id="cap-03" class="cap-slot"><span class="cap-chip">yang patah atau gurita</span></div>
      <div id="cap-04" class="cap-slot"><span class="cap-chip">yang salah posisi.</span></div>
      <div id="cap-05" class="cap-slot"><span class="cap-chip">Bentuk aneh ini bukan</span></div>
      <div id="cap-06" class="cap-slot"><span class="cap-chip">kebetulan, melainkan hasil tabrakan</span></div>
      <div id="cap-07" class="cap-slot"><span class="cap-chip">geologi selama jutaan tahun.</span></div>
      <div id="cap-08" class="cap-slot"><span class="cap-chip">Sulawesi punya empat semenanjung</span></div>
      <div id="cap-09" class="cap-slot"><span class="cap-chip">panjang yang menjulur ke</span></div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Frame-accurate spoken phrase schedule (30 fps) measured from Reference A voiceover:
    // Consecutive phrases within a sentence switch cleanly on exact frame boundaries;
    // sentence openings (cap-01 at f7, cap-08 at f304 after breath pause) enter with a 100ms fade.
    const groups = [
      { sel: "#cap-01", start: 7 / 30, end: 51 / 30, softIn: true, softOut: false },
      { sel: "#cap-02", start: 51 / 30, end: 84 / 30, softIn: false, softOut: false },
      { sel: "#cap-03", start: 84 / 30, end: 127 / 30, softIn: false, softOut: false },
      { sel: "#cap-04", start: 127 / 30, end: 155 / 30, softIn: false, softOut: false },
      { sel: "#cap-05", start: 155 / 30, end: 193 / 30, softIn: false, softOut: false },
      { sel: "#cap-06", start: 193 / 30, end: 246 / 30, softIn: false, softOut: false },
      { sel: "#cap-07", start: 246 / 30, end: 297 / 30, softIn: false, softOut: true },
      // f297..f304 (9.900s..10.133s): 7-frame inter-sentence breath gap
      { sel: "#cap-08", start: 304 / 30, end: 349 / 30, softIn: true, softOut: false },
      { sel: "#cap-09", start: 349 / 30, end: 360 / 30, softIn: false, softOut: false },
    ];

    tl.set(".cap-slot", { opacity: 0, visibility: "hidden" }, 0);

    groups.forEach((g) => {
      if (g.softIn) {
        tl.set(g.sel, { visibility: "visible", opacity: 0 }, g.start);
        tl.to(g.sel, { opacity: 1, duration: 0.10, ease: "power2.out" }, g.start);
      } else {
        tl.set(g.sel, { visibility: "visible", opacity: 1 }, g.start);
      }

      if (g.softOut) {
        tl.to(g.sel, { opacity: 0, duration: 0.08, ease: "power2.in" }, g.end - 0.08);
      }
      // Hard kill at end per hyperframes/references/captions.md
      tl.set(g.sel, { opacity: 0, visibility: "hidden" }, g.end);
    });

    window.__timelines = window.__timelines || {};
    window.__timelines["caption-rail"] = tl;
  </script>
</template>

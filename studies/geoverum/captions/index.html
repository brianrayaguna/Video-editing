<!DOCTYPE html>
<html
  lang="id"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#03161F"},
    {"id":"color-ink","type":"color","label":"Text","default":"#F4F1EA"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#F5C542"},
    {"id":"font-display","type":"string","label":"Display font","default":"Space Grotesk"}
  ]'
>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geoverum Captions — Narrative Captions</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: 'Space Grotesk';
      src: url('assets/fonts/SpaceGrotesk-Variable.ttf') format('truetype');
      font-weight: 300 700;
      font-style: normal;
    }
    :root {
      --color-ground: #03161F;
      --color-ink: #F4F1EA;
      --color-accent: #F5C542;
      --font-display: 'Space Grotesk';
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--color-ground);
      font-family: var(--font-display), sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--color-ground);
    }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="12"
    data-width="1080"
    data-height="1920"
    data-fps="30"
  >
    <video
      id="basemap-video"
      class="clip"
      src="assets/basemap-camera-moves.mp4"
      data-start="0"
      data-duration="12"
      data-media-start="0"
      data-track-index="1"
      muted
      playsinline
      style="position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover;"
    ></video>

    <audio
      id="vo-main"
      class="clip"
      src="assets/vo-12s.m4a"
      data-start="0"
      data-duration="12"
      data-media-start="0"
      data-volume="1"
      data-track-index="2"
    ></audio>

    <div
      id="broadcast-layer"
      data-composition-id="broadcast-layer"
      data-composition-src="compositions/broadcast-layer.html"
      data-start="0"
      data-duration="12"
      data-track-index="3"
      data-track-kind="graphics"
      data-width="1080"
      data-height="1920"
    ></div>

    <div
      id="caption-rail"
      data-composition-id="caption-rail"
      data-composition-src="compositions/caption-rail.html"
      data-start="0"
      data-duration="12"
      data-track-index="4"
      data-track-kind="captions"
      data-width="1080"
      data-height="1920"
    ></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 12 });
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>

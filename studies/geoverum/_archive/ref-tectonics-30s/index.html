<!DOCTYPE html>
<html
  lang="id"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#03161F"},
    {"id":"color-ink","type":"color","label":"Text","default":"#F4F1EA"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#F5C542"}
  ]'
>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geoverum — ref_tectonics 30s Proof Cut</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: 'Space Grotesk';
      src: url('assets/fonts/SpaceGrotesk-Variable.ttf') format('truetype');
      font-weight: 300 700;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #03161F;
      font-family: 'Space Grotesk', sans-serif;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #03161F;
    }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="30"
    data-width="1080"
    data-height="1920"
    data-fps="30"
  >
    <video
      id="basemap-video"
      class="clip"
      src="assets/basemap-30s.mp4"
      data-start="0"
      data-duration="30"
      data-media-start="0"
      data-track-index="1"
      muted
      playsinline
      style="position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover;"
    ></video>

    <audio
      id="vo-main"
      class="clip"
      src="assets/vo-30s.wav"
      data-start="0"
      data-duration="30"
      data-media-start="0"
      data-volume="1"
      data-track-index="2"
    ></audio>

    <div
      id="broadcast-layer"
      data-composition-id="broadcast-layer"
      data-composition-src="compositions/broadcast-layer.html"
      data-start="0"
      data-duration="30"
      data-track-index="3"
      data-track-kind="graphics"
      data-width="1080"
      data-height="1920"
    ></div>

    <div
      id="caption-rail"
      data-composition-id="caption-rail"
      data-composition-src="compositions/caption-rail.html"
      data-start="0"
      data-duration="30"
      data-track-index="4"
      data-track-kind="captions"
      data-width="1080"
      data-height="1920"
      data-layout-allow-overlap="true"
    ></div>
  </div>
</body>
</html>
